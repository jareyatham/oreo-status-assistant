<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#F4FAF3" />
    <meta
      name="description"
      content="Oreo Status Assistant — check if the owner is available"
    />
    <title>Oreo Status</title>

    <!-- Open Graph / social link preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Oreo Status" />
    <meta
      property="og:description"
      content="Check if I'm available right now 🐶"
    />
    <meta
      property="og:image"
      content="https://oreo-status.netlify.app/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter/X card (บาง app เช่น iMessage ก็อ่าน tag นี้ประกอบด้วย) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Oreo Status" />
    <meta
      name="twitter:description"
      content="Check if I'm available right now 🐶"
    />
    <meta
      name="twitter:image"
      content="https://oreo-status.netlify.app/og-image.png"
    />
    <script>
      (function () {
        var saved = localStorage.getItem("oreo-theme");
        var isDark =
          saved === "dark" ||
          (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (isDark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (function () {
        var isController =
          window.location.pathname.indexOf("/control-s1sqlfctl212748") === 0;
        var href = isController
          ? "/manifest-controller.webmanifest"
          : "/manifest.webmanifest";
        var link = document.querySelector('link[rel="manifest"]');
        if (link) {
          link.setAttribute("href", href);
        } else {
          link = document.createElement("link");
          link.rel = "manifest";
          link.href = href;
          document.head.appendChild(link);
        }
      })();
    </script>
  </body>
</html>
